<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office English · Dein Business-Englisch Trainer</title>
<style>
:root{--ink:#24342e;--muted:#738079;--green:#276149;--lime:#dceaa8;--paper:#f6f7f2;--line:#e1e6dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93b845;outline-offset:4px}header{height:88px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:750;letter-spacing:-.7px;display:flex;align-items:center;gap:12px}.logo{background:var(--green);color:white;padding:10px 12px;border-radius:12px}nav{display:flex;gap:8px}nav button{border:0;background:none;padding:12px 18px;color:var(--muted);border-radius:9px}nav button.active{background:#edf3e8;color:var(--green);font-weight:650}main{max-width:1120px;margin:48px auto;padding:0 24px}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:750;letter-spacing:2px;color:var(--green)}h1{font-size:40px;letter-spacing:-1.7px;margin:12px 0}p{line-height:1.65;color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.tag{background:#eaf0e0;color:var(--green);padding:10px 15px;border-radius:30px;font-size:13px}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:24px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:28px}.hero{background:var(--green);color:white;position:relative;overflow:hidden;min-height:235px}.hero p{color:#d5e4db;max-width:350px}.hero h2{font-size:30px;letter-spacing:-.8px;max-width:350px;margin:16px 0}.hero .eyebrow{color:var(--lime)}.hero-art{position:absolute;right:28px;bottom:25px;font-size:78px;transform:rotate(-12deg);opacity:.8}.primary{background:var(--green);color:#fff;border:0;border-radius:10px;padding:13px 20px;font-weight:600}.hero .primary{background:var(--lime);color:var(--ink)}h2{font-size:22px;letter-spacing:-.5px;margin:0 0 18px}h3{font-size:17px;margin:0 0 8px}.stats{display:flex;gap:22px;margin:25px 0}.stat strong{display:block;font-size:28px}.stat small{color:var(--muted)}.track{height:8px;border-radius:10px;background:#eaf0e3;overflow:hidden}.track div{height:100%;background:#9bbb5b;transition:width .3s}.section-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 16px}.section-head h2{margin:0}.section-head span{font-size:13px;color:var(--muted)}.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.topic{border:1px solid var(--line);border-radius:15px;padding:20px;background:white;text-align:left;color:var(--ink);transition:transform .2s,border .2s}.topic:hover{transform:translateY(-3px);border-color:#91ac79}.icon{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#eef2e7;font-size:20px;margin-bottom:16px}.topic small{display:block;color:var(--muted);margin-top:8px}.tip{background:#f0f3e7;margin-top:24px}.tip blockquote{font-size:19px;margin:20px 0;color:var(--green);line-height:1.5}.tip small{color:var(--muted)}footer{margin:35px 0;color:var(--muted);font-size:12px;text-align:center}.quiz{max-width:760px;margin:0 auto}.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.secondary{border:1px solid var(--line);border-radius:9px;padding:10px 15px;background:white;color:var(--ink)}select,input{border:1px solid var(--line);padding:12px;border-radius:9px;background:white;color:var(--ink)}.question{text-align:center;padding:36px 0 24px}.question h2{font-size:36px;margin:18px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{padding:18px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}.answer:hover:not(:disabled){background:#f2f5eb}.answer.correct{border-color:#528353;background:#e8f3e5}.answer.wrong{border-color:#cb8179;background:#fff0ed}.answer:disabled{cursor:default;color:var(--ink)}.feedback{margin-top:20px;padding:20px;background:#f2f5ec;border-radius:12px}.feedback p{margin:9px 0}.feedback .primary{margin-top:10px}.lesson{margin-bottom:18px}.lesson p{margin:10px 0}.example{border-left:3px solid #9bbb5b;padding:12px 18px;background:#f5f7ef;margin:16px 0}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}input{flex:1;min-width:190px}.word{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);gap:20px}.word:last-child{border:0}.word p{margin:5px 0;font-size:13px}.word strong{font-size:17px}.word span{color:var(--green);white-space:nowrap}.empty{padding:30px;text-align:center}[hidden]{display:none!important}@media(max-width:760px){header{height:auto;gap:16px;padding:20px;flex-direction:column}nav{gap:2px}nav button{padding:10px 12px}main{margin-top:30px}.grid{grid-template-columns:1fr}.intro{align-items:start;gap:12px}h1{font-size:30px}.tag{display:none}.card{padding:22px}.hero-art{font-size:50px;right:15px;bottom:15px}.hero h2{max-width:280px;font-size:26px}.hero p{max-width:260px}.answers{grid-template-columns:1fr}.quiz-top{gap:10px;flex-wrap:wrap}.word{flex-direction:column;gap:6px}}
</style>
</head>
<body>
<header><div class="brand"><span class="logo">oe.</span>office english<span style="color:#91a27e">✦</span></div><nav aria-label="Hauptnavigation"><button data-view="home" class="active">Übersicht</button><button data-view="words">Vokabeln</button><button data-view="tips">Tipps & Erklärungen</button></nav></header>
<main id="app"></main><footer>Ein kleiner Schritt jeden Tag. Mehr Sicherheit im Berufsalltag.</footer>
<script>
const categories=['Meetings','E-Mails','Projekte','Networking'];
const vocab=[
['agenda','Tagesordnung','Meetings','Let’s go through the agenda.','Agenda bezeichnet die Themenliste eines Meetings.'],
['to reschedule','einen Termin verschieben','Meetings','Could we reschedule our meeting?','Mit „Could we …?“ fragst du höflich nach einer Terminänderung.'],
['minutes','Besprechungsprotokoll','Meetings','I will send you the minutes after the meeting.','„Minutes“ bedeutet hier Protokoll, nicht Minuten.'],
['to clarify','klarstellen','Meetings','Could you clarify that point?','Nutze diese Formulierung, wenn du einen Punkt genauer verstehen möchtest.'],
['proposal','Vorschlag','Meetings','Thank you for your proposal.','Ein proposal kann auch ein formelles Angebot oder Konzept sein.'],
['attachment','Anhang','E-Mails','Please find the report in the attachment.','Ein attachment ist eine Datei, die du einer E-Mail beifügst.'],
['to follow up','nachfassen','E-Mails','I’m following up on my previous email.','Follow up verwendest du, wenn du an eine offene Anfrage anknüpfst.'],
['regarding','bezüglich','E-Mails','I’m writing regarding your request.','Regarding leitet das Thema deiner Nachricht ein.'],
['inquiry','Anfrage','E-Mails','Thank you for your inquiry.','Eine inquiry ist eine Bitte um Informationen.'],
['to confirm','bestätigen','E-Mails','Could you confirm the appointment?','Mit confirm bestätigst du beispielsweise einen Termin oder den Erhalt einer Nachricht.'],
['deadline','Abgabetermin','Projekte','We need to meet the deadline.','„Meet a deadline“ bedeutet, einen Abgabetermin einzuhalten.'],
['budget','Finanzrahmen','Projekte','The project is within budget.','„Within budget“ heißt, dass die Kosten im geplanten Rahmen liegen.'],
['milestone','Meilenstein','Projekte','We have reached an important milestone.','Ein milestone ist ein wichtiger Zwischenpunkt im Projekt.'],
['stakeholder','Interessengruppe oder Beteiligter','Projekte','We should inform all stakeholders.','Stakeholders sind Personen oder Gruppen, die ein Interesse am Projekt haben.'],
['deliverable','abzulieferndes Ergebnis','Projekte','The first deliverable is a draft report.','Ein deliverable ist ein konkretes Projektergebnis, etwa ein Bericht.'],
['colleague','Kollege oder Kollegin','Networking','Let me introduce my colleague.','Colleague bezeichnet jemanden, mit dem du zusammenarbeitest.'],
['expertise','Fachwissen','Networking','She has expertise in marketing.','Expertise beschreibt besondere Kenntnisse auf einem Gebiet.'],
['opportunity','Gelegenheit','Networking','This is a great opportunity to connect.','Opportunity ist eine günstige Gelegenheit oder Chance.'],
['partnership','Partnerschaft','Networking','We are looking for a long-term partnership.','Eine partnership ist eine Zusammenarbeit zwischen Personen oder Unternehmen.'],
['to get in touch','Kontakt aufnehmen','Networking','I will get in touch next week.','Eine natürliche Formulierung, um eine spätere Kontaktaufnahme anzukündigen.']
];
const lessons=[['Höflich um etwas bitten','Ein kleines „Could you …?“ macht deine Bitte freundlicher. Mit „please“ und einem Dank rundest du sie ab.','Could you please send me the report?','Könnten Sie mir bitte den Bericht schicken?'],['E-Mails einfach aufbauen','Beginne mit einer Begrüßung, nenne den Anlass und formuliere eine konkrete Bitte. „Best regards“ passt als professionelle Grußformel.','Hi Alex, I’m writing regarding our meeting. Could you confirm the time? Best regards, Sam','Hallo Alex, ich schreibe bezüglich unseres Meetings. Könntest du die Uhrzeit bestätigen? Viele Grüße, Sam'],['Im Meeting nachfragen','Du musst nicht alles sofort verstehen. Bitte um Wiederholung oder um eine Erklärung. Das wirkt aufmerksam und hilft Missverständnisse zu vermeiden.','Could you explain what you mean by that?','Könnten Sie erklären, was Sie damit meinen?'],['Eine Meinung vorsichtig formulieren','Mit „I think …“ formulierst du deine Sichtweise. „We could …“ macht aus einem Befehl einen konstruktiven Vorschlag.','I think we could try a different approach.','Ich denke, wir könnten einen anderen Ansatz ausprobieren.'],['Typischer Stolperstein: actually','„Actually“ bedeutet „eigentlich“ oder „tatsächlich“. Für „aktuell“ verwendest du je nach Kontext „current“ oder „currently“.','We are currently working on the proposal.','Wir arbeiten aktuell an dem Vorschlag.'],['Termine eindeutig nennen','Nutze klare Angaben zu Datum, Uhrzeit und gegebenenfalls Zeitzone. „By Friday“ bedeutet spätestens am Freitag, „on Friday“ bedeutet am Freitag.','Could you send the draft by Friday?','Könnten Sie den Entwurf bis Freitag schicken?']];
let progress={answered:0,correct:0,learned:[],days:[]};let storageOk=true;
try{const saved=JSON.parse(localStorage.getItem('officeEnglishProgress'));if(saved&&Number.isInteger(saved.answered)&&Number.isInteger(saved.correct)&&Array.isArray(saved.learned)&&Array.isArray(saved.days))progress=saved}catch{storageOk=false}
const app=document.getElementById('app');let view='home',queue=[],position=0,score=0,locked=false,currentOptions=[];
const dateKey=()=>new Date().toLocaleDateString('sv-SE');
function save(){try{localStorage.setItem('officeEnglishProgress',JSON.stringify(progress))}catch{storageOk=false}}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function go(next){view=next;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===next));if(next==='home')home();if(next==='words')words();if(next==='tips')tips();window.scrollTo(0,0)}
function home(){const today=progress.days.filter(x=>x.date===dateKey()).reduce((n,x)=>n+x.count,0);app.innerHTML=`<div class="intro"><div><div class="eyebrow">Dein Englisch. Dein nächster Schritt.</div><h1>Ready for business.</h1><p>Mehr Selbstvertrauen für deinen Arbeitsalltag – Wort für Wort.</p></div><span class="tag">✦ Für Einsteiger · A2–B1</span></div><div class="grid"><div><section class="card hero"><div class="eyebrow">5 Minuten für dich</div><h2>Kleine Lerneinheit.<br>Großer Unterschied.</h2><p>Übe die Wörter, die du im Büro wirklich brauchst. Mit Beispielen, die hängen bleiben.</p><button class="primary" id="start">Vokabeltraining starten →</button><div class="hero-art" aria-hidden="true">Aa↗</div></section><div class="section-head"><h2>Deine Themen</h2><span>${vocab.length} Vokabeln</span></div><div class="topics">${categories.map((c,i)=>`<button class="topic" data-category="${c}"><span class="icon">${['◷','✉','▤','☏'][i]}</span><h3>${c}</h3><small>${['Sicher mitreden und nachfragen','Klar und höflich schreiben','Von der Planung bis zur Deadline','Kontakte knüpfen und pflegen'][i]}</small><small>Training starten →</small></button>`).join('')}</div></div><aside><section class="card"><div class="eyebrow">Dein Lernfortschritt</div><h2 style="margin-top:14px">Du machst den Unterschied.</h2><div class="stats"><div class="stat"><strong>${progress.learned.length}<span style="font-size:15px;color:var(--muted)"> / ${vocab.length}</span></strong><small>Wörter richtig beantwortet</small></div><div class="stat"><strong>${progress.answered?Math.round(progress.correct/progress.answered*100):0}%</strong><small>Richtige Antworten</small></div></div><div class="track"><div style="width:${Math.min(today/5*100,100)}%"></div></div><p style="font-size:13px">Tagesziel: ${Math.min(today,5)} von 5 Antworten ${today>=5?'· Geschafft! ✦':''}</p><small style="color:var(--muted)">${storageOk?'Dein Fortschritt wird in diesem Browser gespeichert.':'Fortschritt bleibt nur für diese Sitzung erhalten.'}</small></section><section class="card tip"><span class="icon">✧</span><h3>Ein Tipp für heute</h3><p>Eine höfliche Bitte öffnet Türen.</p><blockquote>“Could you please send me the report?”</blockquote><small>„Könnten Sie mir bitte den Bericht schicken?“</small><p style="font-size:13px">„Could you …?“ wirkt freundlicher als eine direkte Aufforderung.</p><button class="secondary" id="more">Mehr Tipps entdecken →</button></section></aside></div>`;document.getElementById('start').onclick=()=>start();document.getElementById('more').onclick=()=>go('tips');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>start(b.dataset.category))}
function start(category){queue=shuffle(vocab.filter(w=>!category||w[2]===category)).slice(0,5);position=0;score=0;view='quiz';document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));question();window.scrollTo(0,0)}
function question(){locked=false;const w=queue[position];currentOptions=shuffle([w[1],...shuffle(vocab.filter(v=>v[1]!==w[1])).slice(0,3).map(v=>v[1])]);app.innerHTML=`<div class="quiz"><div class="quiz-top"><button class="secondary" id="back">← Übersicht</button><span>${w[2]} · Frage ${position+1} von ${queue.length}</span></div><div class="track"><div style="width:${position/queue.length*100}%"></div></div><section class="card" style="margin-top:24px"><div class="question"><div class="eyebrow">Was bedeutet dieses Wort?</div><h2 lang="en">${w[0]}</h2><p>Wähle die passende deutsche Übersetzung.</p></div><div class="answers">${currentOptions.map((a,i)=>`<button class="answer" data-answer="${i}">${a}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div></section></div>`;document.getElementById('back').onclick=()=>go('home');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)))}
function answer(index){if(locked)return;locked=true;const w=queue[position],right=currentOptions[index]===w[1];if(right){score++;progress.correct++;if(!progress.learned.includes(w[0]))progress.learned.push(w[0])}progress.answered++;let day=progress.days.find(x=>x.date===dateKey());if(!day){day={date:dateKey(),count:0};progress.days.push(day)}day.count++;save();document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(currentOptions[Number(b.dataset.answer)]===w[1])b.classList.add('correct');else if(Number(b.dataset.answer)===index)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${right?'✓ Richtig! Gut gemacht.':'Noch nicht ganz – du lernst gerade dazu.'}</strong><p><strong>${w[0]}</strong> bedeutet <strong>${w[1]}</strong>.</p><p lang="en">“${w[3]}”</p><p>${w[4]}</p><button class="primary" id="next">${position===queue.length-1?'Ergebnis ansehen':'Nächste Vokabel'} →</button></div>`;document.getElementById('next').onclick=()=>{position++;if(position<queue.length)question();else result()}}
function result(){app.innerHTML=`<div class="quiz card" style="text-align:center;padding:50px 25px"><div class="eyebrow">Lerneinheit abgeschlossen</div><h1>${score>=4?'Stark gemacht!':'Ein Schritt weiter!'} ✦</h1><p>Du hast <strong>${score} von ${queue.length}</strong> Vokabeln richtig beantwortet.<br>Jede Wiederholung hilft dir, sicherer zu werden.</p><div class="toolbar" style="justify-content:center"><button class="primary" id="again">Noch eine Runde →</button><button class="secondary" id="back">Zur Übersicht</button></div><h3>Deine Wörter aus dieser Runde</h3>${queue.map(w=>`<div class="word" style="text-align:left"><strong>${w[0]}</strong><span>${w[1]}</span></div>`).join('')}</div>`;document.getElementById('again').onclick=()=>start();document.getElementById('back').onclick=()=>go('home')}
function words(){app.innerHTML=`<div class="eyebrow">Dein Wortschatz fürs Büro</div><h1>Wörter, die weiterhelfen.</h1><p>${vocab.length} Business-Vokabeln mit Übersetzung, Beispielen und Erklärungen.</p><div class="toolbar"><input id="search" aria-label="Vokabeln durchsuchen" placeholder="Englisches oder deutsches Wort suchen …"><select id="category" aria-label="Thema auswählen"><option value="">Alle Themen</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select><button class="primary" id="practice">Vokabeln üben →</button></div><section class="card" id="list"></section>`;const render=()=>{const q=document.getElementById('search').value.toLocaleLowerCase(),c=document.getElementById('category').value;const rows=vocab.filter(w=>(!c||w[2]===c)&&w.join(' ').toLocaleLowerCase().includes(q));document.getElementById('list').innerHTML=rows.length?rows.map(w=>`<article class="word"><div><strong lang="en">${w[0]}</strong><p lang="en">${w[3]}</p><p>${w[4]}</p></div><span>${w[1]}</span></article>`).join(''):'<p class="empty">Keine Vokabel gefunden. Probiere einen anderen Suchbegriff.</p>'};document.getElementById('search').oninput=render;document.getElementById('category').onchange=render;document.getElementById('practice').onclick=()=>start(document.getElementById('category').value);render()}
function tips(){app.innerHTML=`<div class="eyebrow">Einfach erklärt</div><h1>So klingt’s professionell.</h1><p>Praktische Tipps für die nächste E-Mail, das nächste Meeting und deinen Alltag.</p><div style="max-width:850px;margin-top:30px">${lessons.map((l,i)=>`<article class="card lesson"><div class="eyebrow">Tipp ${String(i+1).padStart(2,'0')}</div><h2 style="margin-top:12px">${l[0]}</h2><p>${l[1]}</p><div class="example"><strong lang="en">${l[2]}</strong><p>${l[3]}</p></div></article>`).join('')}<button class="primary" id="practice">Jetzt Vokabeln üben →</button></div>`;document.getElementById('practice').onclick=()=>start()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));home();
</script>
<script src="grammar.js"></script>
</body>
</html>
